{% extends 'base.html' %}
{% block title %}Delete Photo — PhotoAlbum{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <img src="{{ object.image.url }}" class="img-fluid rounded mb-3 mx-auto" style="max-height:180px; object-fit:cover" alt="{{ object.title }}">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2rem"></i>
      <h5 class="mt-2 fw-bold">Delete "{{ object.title }}"?</h5>
      <p class="text-muted small">This photo will be permanently removed. This cannot be undone.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash me-1"></i>Delete Photo</button>
        <a href="{% url 'photo_detail' object.pk %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
