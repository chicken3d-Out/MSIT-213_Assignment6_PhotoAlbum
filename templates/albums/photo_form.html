{% extends 'base.html' %}
{% block title %}Edit Photo — PhotoAlbum{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-pencil text-primary me-2"></i>Edit Photo</h4>
      <div class="mb-3">
        <img src="{{ object.image.url }}" class="img-fluid rounded" style="max-height:200px; object-fit:cover" alt="{{ object.title }}">
      </div>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
          <a href="{% url 'photo_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
